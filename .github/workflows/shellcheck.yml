name: ShellCheck

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  shellcheck:
    name: Run ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on SD_ROOT shell scripts
        run: |
          find SD_ROOT/ v2_install/ -name "*.sh" -print0 \
            | xargs -0 shellcheck \
                --shell=sh \
                --severity=warning \
                --exclude=SC1090,SC1091
        # SC1090/SC1091: ShellCheck cannot follow dynamic source paths such as
        # `. /opt/wz_mini/wz_mini.conf` or `. /opt/wz_mini/etc/rc.common`
        # because those files live on the camera at runtime, not in the repo
        # checkout.  All other warnings are treated as errors.
