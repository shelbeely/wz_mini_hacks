<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Camera View</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #111; color: #eee; padding: 16px; }
h1 { font-size: 1.3rem; margin-bottom: 14px; color: #fff; }
#alert-banner {
  display: none;
  background: #7a1212;
  border: 1px solid #c0392b;
  border-radius: 6px;
  padding: 10px 14px;
  margin-bottom: 14px;
  font-size: 0.9rem;
  font-weight: bold;
  color: #ffd;
  position: relative;
}
#alert-dismiss {
  position: absolute;
  right: 10px;
  top: 8px;
  cursor: pointer;
  color: #faa;
  font-size: 1rem;
  background: none;
  border: none;
  padding: 0;
}
#snapshot {
  max-width: 100%;
  width: 100%;
  border: 2px solid #333;
  border-radius: 6px;
  display: block;
  background: #222;
}
#description {
  margin-top: 14px;
  background: #1e1e1e;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 12px 14px;
  font-size: 0.95rem;
  line-height: 1.55;
  min-height: 60px;
  white-space: pre-wrap;
  word-wrap: break-word;
}
.turn {
  border-radius: 5px;
  padding: 9px 12px;
  margin-bottom: 8px;
}
.turn:last-child { margin-bottom: 0; }
.turn-assistant { background: #1a2233; border: 1px solid #2a3a5a; }
.turn-tool      { background: #1c1c1c; border: 1px solid #2f2f2f; }
.turn-label {
  display: block;
  font-size: 0.72rem;
  font-weight: bold;
  color: #7aa;
  margin-bottom: 4px;
}
.turn-tool .turn-label { color: #888; }
.turn-content {
  font-size: 0.9rem;
  line-height: 1.5;
  white-space: pre-wrap;
  word-wrap: break-word;
}
#meta { margin-top: 8px; font-size: 0.78rem; color: #777; }
#status { margin-top: 6px; font-size: 0.78rem; color: #5af; }
.label { font-weight: bold; color: #aaa; }
a { color: #5af; text-decoration: none; }
a:hover { text-decoration: underline; }
#bar {
  margin-top: 20px;
  padding-top: 8px;
  border-top: 1px solid #333;
  font-size: 0.75rem;
  color: #555;
}
</style>
</head>
<body>
<h1>AI Camera</h1>
<div id="alert-banner"><button id="alert-dismiss" title="Dismiss">✕</button><span id="alert-text"></span></div>
<img id="snapshot" src="/ai/snapshot.jpg" alt="Camera snapshot" />
<div id="description">Waiting for first result…</div>
<div id="meta"></div>
<div id="status"></div>
<div id="bar"><a href="/">← Back to menu</a></div>

<script>
var POLL_MS = 5000;
var ALERT_POLL_MS = 15000;
var alertDismissed = false;

function addCacheBuster(url) {
  return url + (url.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now();
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

document.getElementById("alert-dismiss").onclick = function () {
  alertDismissed = true;
  document.getElementById("alert-banner").style.display = "none";
};

function refreshSnapshot() {
  var img = document.getElementById("snapshot");
  var src = img.getAttribute("data-src") || "/ai/snapshot.jpg";
  img.setAttribute("data-src", src);
  img.src = addCacheBuster(src);
}

function refreshAlert() {
  if (alertDismissed) return;
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "/cgi-bin/ai.cgi?alert=1&t=" + Date.now(), true);
  xhr.timeout = 4000;
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4 || xhr.status !== 200) return;
    try {
      var data = JSON.parse(xhr.responseText);
      var banner = document.getElementById("alert-banner");
      if (data && data.message) {
        document.getElementById("alert-text").textContent = "⚠ Alert: " + data.message;
        banner.style.display = "block";
      }
    } catch (e) { /* ignore */ }
  };
  xhr.send();
}

function refreshResult() {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", addCacheBuster("/cgi-bin/ai.cgi"), true);
  xhr.timeout = 4000;
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    if (xhr.status !== 200) {
      document.getElementById("status").textContent = "Could not reach /cgi-bin/ai.cgi";
      return;
    }
    try {
      var data = JSON.parse(xhr.responseText);
      var model = data.model || "unknown";
      var mode = data.mode || "image";
      var ts = data.timestamp || "unknown";
      document.getElementById("meta").textContent =
        "Last analysis: " + ts + "  |  Model: " + model + "  |  Mode: " + mode;

      var desc = document.getElementById("description");
      if (mode === "agent" && data.conversation && data.conversation.length > 0) {
        var html = "";
        for (var i = 0; i < data.conversation.length; i++) {
          var turn = data.conversation[i];
          var role = turn.role || "unknown";
          var content = turn.content || "";
          var isTool = role === "tool_result";
          var cls = isTool ? "turn turn-tool" : "turn turn-assistant";
          var label = isTool ? "🔧 Tool result" : "🤖 Assistant";
          html += '<div class="' + cls + '">' +
            '<span class="turn-label">' + label + '</span>' +
            '<div class="turn-content">' + escapeHtml(content) + '</div>' +
            '</div>';
        }
        desc.innerHTML = html;
      } else {
        var content = "";
        if (data.response && data.response.choices && data.response.choices.length > 0) {
          content = data.response.choices[0].message.content;
        } else if (data.response && data.response.error) {
          content = "API error: " + data.response.error.message;
        } else {
          content = "No result yet — analysis may still be running.";
        }
        desc.textContent = content;
      }
    } catch (e) {
      document.getElementById("description").textContent = "Waiting for first result…";
    }
  };
  xhr.send();
}

function tick() {
  refreshSnapshot();
  refreshResult();
  document.getElementById("status").textContent =
    "Auto-refreshing every " + (POLL_MS / 1000) + " s";
}

tick();
setInterval(tick, POLL_MS);
refreshAlert();
setInterval(refreshAlert, ALERT_POLL_MS);
</script>
</body>
</html>
